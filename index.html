<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Coffee?</title>
<meta name="theme-color" content="#16182B">
<meta property="og:title" content="Ally, coffee?">
<meta property="og:description" content="see you later at JWU">
<meta property="og:type" content="website">
<!-- For a thumbnail in the chat preview, add your full published URL:
     <meta property="og:image" content="https://YOURNAME.github.io/REPO/reaction.gif"> -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16182B;
  --chalk:#FFF3E4;
  --zest:#FF6A2B;
  --dim:rgba(255,243,228,.52);
  --hair:rgba(255,243,228,.20);
  --pad:clamp(22px,6vw,60px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--ink);color:var(--chalk);
  font-family:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  font-weight:400;
  min-height:100svh;
  display:flex;flex-direction:column;
  padding:max(var(--pad),env(safe-area-inset-top)) var(--pad) max(var(--pad),env(safe-area-inset-bottom));
  transition:background-color .55s cubic-bezier(.4,0,.2,1),color .55s cubic-bezier(.4,0,.2,1);
}
body.won{background:var(--zest);color:var(--ink)}

.stage{flex:1;display:flex;flex-direction:column;max-width:600px;width:100%;margin:0 auto}
.stage>section{margin-block:auto}   /* centres when it fits, scrolls when it doesn't */
[hidden]{display:none!important}

.ask{font-weight:800;font-size:clamp(58px,17vw,112px);line-height:.86;letter-spacing:-.045em;margin:0}
.mono{font-size:clamp(15px,4vw,18px);line-height:1.55;color:var(--dim);margin:20px 0 0}
body.won .mono{color:rgba(22,24,43,.62)}

/* ---- screen 1 ---- */
.yes{
  display:block;width:100%;margin-top:38px;
  background:var(--zest);color:var(--ink);border:0;border-radius:2px;
  padding:24px;cursor:pointer;
  font-family:inherit;font-weight:800;font-size:clamp(26px,7vw,34px);letter-spacing:-.02em;
  transition:transform .12s ease;
}
.yes:active{transform:scale(.985)}
.no{
  display:block;margin:18px auto 0;background:none;border:0;cursor:pointer;
  font-family:inherit;font-size:17px;font-weight:600;color:var(--dim);
  padding:12px 20px;text-decoration:underline;text-underline-offset:5px;
}
.no:hover{color:var(--chalk)}

/* ---- screen 2 ---- */
.recap{font-size:clamp(19px,5vw,24px);font-weight:600;letter-spacing:-.02em;margin:0 0 26px;line-height:1.3}
.recap b{font-weight:800}
.opts{list-style:none;margin:0;padding:0;border-top:1px solid var(--hair)}
.opts li{border-bottom:1px solid var(--hair)}
.opts button{
  display:flex;align-items:center;gap:16px;width:100%;min-height:64px;
  background:none;border:0;cursor:pointer;padding:14px 6px;text-align:left;
  font-family:inherit;color:var(--chalk);
  transition:background-color .18s ease,padding-left .18s ease;
}
.opts button:hover{background:rgba(255,243,228,.07);padding-left:12px}
.opts .ltr{
  flex:0 0 34px;height:34px;display:grid;place-items:center;
  border:1px solid var(--hair);border-radius:2px;
  font-weight:800;font-size:14px;color:var(--dim);
}
.opts button:hover .ltr{border-color:var(--zest);color:var(--zest)}
.opts .txt{font-size:clamp(19px,5vw,23px);font-weight:600;letter-spacing:-.02em}

.nudge{font-size:14px;font-weight:600;color:var(--dim);margin:20px 0 0}

/* one orchestrated entrance, staggered */
.rise{animation:rise .42s cubic-bezier(.2,.8,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---- screen 3 ---- */
.verdict{font-weight:800;font-size:clamp(76px,25vw,168px);line-height:.78;letter-spacing:-.055em;margin:0}
.tail{font-weight:600;font-size:clamp(26px,8vw,48px);line-height:1;letter-spacing:-.035em;margin:6px 0 0}
.punch{
  display:inline-block;margin:32px 0 0;padding:10px 18px 13px;
  background:var(--ink);color:var(--zest);
  font-weight:800;font-size:clamp(30px,9vw,54px);letter-spacing:-.035em;line-height:1;
  transform:rotate(-1.6deg);
}
.quip{font-weight:600;font-size:clamp(20px,5.5vw,27px);letter-spacing:-.025em;margin:26px 0 0}
.foot{font-weight:600;font-size:clamp(16px,4.2vw,19px);margin:8px 0 0;opacity:.6}
.tiny{font-weight:600;font-size:13px;margin:24px 0 0;opacity:.42}
.gif{
  display:block;width:100%;max-width:400px;max-height:36svh;object-fit:cover;
  margin:26px 0 0;border:3px solid var(--ink);border-radius:3px;
  transform:rotate(1.2deg);background:rgba(22,24,43,.08);
}

:focus-visible{outline:2.5px solid currentColor;outline-offset:3px}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>

<main class="stage">

  <!-- 1 -->
  <section id="s1">
    <h1 class="ask" id="ask"></h1>
    <p class="mono" id="details"></p>
    <button class="yes" data-yes>Yes</button>
    <button class="no" id="tap-no">No</button>
  </section>

  <!-- 2 -->
  <section id="s2" hidden>
    <p class="recap">You said <b>no</b>. Which no?</p>
    <ul class="opts" id="opts"></ul>
    <p class="nudge" id="nudge" hidden>stalling just makes more options</p>
  </section>

  <!-- 3 -->
  <section id="s3" hidden>
    <h1 class="verdict" id="v-head"></h1>
    <p class="tail" id="v-tail"></p>
    <p class="punch">that's a yes</p>
    <p class="quip" id="v-quip"></p>
    <img class="gif" id="v-gif" alt="" hidden>
    <p class="foot" id="v-foot"></p>
    <p class="tiny">no takebacks</p>
  </section>

</main>

<script>
/* ═══ EDIT THIS ═══════════════════════════════════════ */
const CONFIG = {
  question: "Ally, coffee?",
  place:    "JWU",
  // Drop the file next to index.html. Filename only — no folders.
  gif:      "reaction.gif"
};
/* ═════════════════════════════════════════════════════ */

// Every option opens with "No" and every option means yes.
// head = the huge word, tail = the small word that flips it.
const NOS = [
  // add  gif:"name.gif"  to any line below to give that answer its own reaction
  { head:"No",  tail:"hesitation.",         quip:"damn. ok." },
  { head:"No",  tail:"brainer.",            quip:"correct." },
  { head:"No",  tail:"doubt about it.",     quip:"that makes one of us." },
  { head:"No",  tail:"way I'm missing it.", quip:"you better not." }
];

// Wait too long on the choices and more of them appear. Still all nos. Still all yeses.
const LATE = [
  { at: 6000,  head:"No", tail:"rush. still yes.",          quip:"took your time." },
  { at:13000,  head:"No", tail:"point pretending otherwise.",quip:"there it is." }
];

const $ = s => document.querySelector(s);
const A = "ABCDEF";

$("#ask").textContent = CONFIG.question;
$("#details").textContent = `see you later at ${CONFIG.place}`;
$("#v-foot").textContent = `see you later at ${CONFIG.place}`;

function show(n){
  [1,2,3].forEach(i => { $("#s" + i).hidden = i !== n; });
  document.body.classList.toggle("won", n === 3);
  window.scrollTo(0, 0);
}

/* screen 2: build the choices */
const list = $("#opts");
let count = 0, timers = [];

function addOption(o, delay){
  const li = document.createElement("li");
  const b  = document.createElement("button");
  b.className = "rise";
  b.style.animationDelay = delay + "ms";
  const l = document.createElement("span"); l.className = "ltr"; l.textContent = A[count++];
  const t = document.createElement("span"); t.className = "txt"; t.textContent = `${o.head} ${o.tail}`;
  b.append(l, t);
  b.addEventListener("click", () => land(o));
  li.append(b); list.append(li);
}

NOS.forEach((o, i) => addOption(o, 60 + i * 55));   // stagger, one entrance only

$("#tap-no").addEventListener("click", () => {
  show(2);
  LATE.forEach(o => timers.push(setTimeout(() => {
    addOption(o, 0);
    $("#nudge").hidden = false;
  }, o.at)));
});

/* tapping Yes lands on the same place, without the detour */
document.querySelectorAll("[data-yes]").forEach(b =>
  b.addEventListener("click", () => land(
    { head:"Yes.", tail:"", quip:"", slab:false }
  ))
);

$("#v-gif").addEventListener("error", e => { e.target.hidden = true; });

function land(o){
  timers.forEach(clearTimeout);                  // she chose; stop growing the list
  $("#v-head").textContent = o.head;
  $("#v-tail").textContent = o.tail;
  $("#v-tail").hidden = !o.tail;
  $("#v-quip").textContent = o.quip;
  $("#v-quip").hidden = !o.quip;

  const g = $("#v-gif"), src = o.gif || CONFIG.gif;   // per-option gif wins if set
  g.hidden = !src;
  if (src) g.src = src;
  $(".punch").hidden = o.slab === false;         // "that's a yes" under "Yes." is redundant
  show(3);
}
</script>
</body>
</html>
